<title>돌파 스크리너</title>
<style>
:root{
  --bg:#f4f6f4; --panel:#ffffff; --panel2:#eef1ee; --line:#d5dbd6; --line2:#e6eae6;
  --ink:#161b18; --mut:#5f6b63; --dim:#8b968d;
  --acc:#0f8f6b;            /* 수축·통과 */
  --up:#d8443f;             /* 한국식 상승/수익 */
  --dn:#2f7fc9;             /* 한국식 하락/손실 */
  --warn:#b8791f;
  --shadow:0 1px 2px rgba(20,30,24,.06),0 8px 24px -16px rgba(20,30,24,.28);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101512; --panel:#171d1a; --panel2:#1d2421; --line:#2b342f; --line2:#232b27;
    --ink:#e8ece9; --mut:#9aa79f; --dim:#6d7a72;
    --acc:#3fbf95; --up:#e8635c; --dn:#5aa2e0; --warn:#d69b3f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="light"]{
  --bg:#f4f6f4; --panel:#ffffff; --panel2:#eef1ee; --line:#d5dbd6; --line2:#e6eae6;
  --ink:#161b18; --mut:#5f6b63; --dim:#8b968d;
  --acc:#0f8f6b; --up:#d8443f; --dn:#2f7fc9; --warn:#b8791f;
  --shadow:0 1px 2px rgba(20,30,24,.06),0 8px 24px -16px rgba(20,30,24,.28);
}
:root[data-theme="dark"]{
  --bg:#101512; --panel:#171d1a; --panel2:#1d2421; --line:#2b342f; --line2:#232b27;
  --ink:#e8ece9; --mut:#9aa79f; --dim:#6d7a72;
  --acc:#3fbf95; --up:#e8635c; --dn:#5aa2e0; --warn:#d69b3f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard Variable",Pretendard,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px 80px}

/* ── 상단 */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:12px 0 0}
.hrow{max-width:1060px;margin:0 auto;padding:0 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0;letter-spacing:-.02em;font-weight:700}
.asof{color:var(--mut);font-size:13px}
.regime{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.02em;
  padding:4px 11px;border-radius:999px;border:1px solid currentColor}
.fresh{font:inherit;font-size:12px;font-weight:700;letter-spacing:.02em;cursor:pointer;
  padding:4px 11px;border-radius:999px;border:1px solid currentColor;background:none}
.fresh.ok{color:var(--acc)} .fresh.mid{color:var(--warn)} .fresh.old{color:var(--dim)}
.fresh:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.r-bull{color:var(--up)} .r-mix{color:var(--warn)} .r-bear{color:var(--dn)}
nav{max-width:1060px;margin:0 auto;padding:8px 16px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);
  font:inherit;font-size:13.5px;font-weight:600;padding:8px 12px 9px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
nav button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;border-radius:4px}

section[hidden]{display:none}
h2{font-size:15px;margin:30px 0 4px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
h2 .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--panel2);color:var(--mut);letter-spacing:.03em}
.lede{color:var(--mut);font-size:13.5px;margin:0 0 14px;max-width:62ch}

/* ── 브레스 타일 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin:14px 0 6px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 13px 13px;
  box-shadow:var(--shadow);display:flex;flex-direction:column}
.tile .k{font-size:11.5px;color:var(--mut);letter-spacing:.02em;font-weight:600}
.tile .v{font-size:25px;font-weight:700;letter-spacing:-.02em;margin:3px 0 10px;white-space:nowrap}
.tile .v.sm{font-size:19px}
.meter{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:auto}
.meter i{display:block;height:100%;background:var(--acc)}
.tile .sub{font-size:11.5px;color:var(--dim);margin-top:7px;min-height:2.4em}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2)}
th{font-size:11.5px;color:var(--mut);font-weight:600;letter-spacing:.02em;background:var(--panel2);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.pos{color:var(--up)} .neg{color:var(--dn)} .zero{color:var(--dim)}

/* ── 후보 카드 */
.cards{display:flex;flex-direction:column;gap:9px;margin-top:12px}
details.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);overflow:hidden}
details.card>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;
  grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.sym{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.score{font-size:11.5px;font-weight:700;color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--acc) 32%,transparent);border-radius:5px;padding:1px 6px}
.tier{font-size:10.5px;font-weight:700;border-radius:5px;padding:1.5px 6px;letter-spacing:.03em}
.t-main{color:#fff;background:var(--acc)}
.t-sub{color:var(--dim);border:1px solid var(--line)}
.oneline{grid-column:1/-1;font-size:12.5px;color:var(--mut);margin-top:7px;line-height:1.55}
.oneline b{font-weight:700}
.oneline .good{color:var(--acc)}
.oneline .bad{color:var(--warn)}
.oneline .sep{color:var(--line);margin:0 2px}
.ez{width:100%;font-size:13px;border-collapse:collapse;margin:14px 0 2px}
.ez td{padding:7.5px 10px 7.5px 0;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
.ez tr:last-child td{border-bottom:0}
.ez td.k{width:74px;color:var(--mut);font-weight:600;font-size:12px;white-space:nowrap}
.ez td.v{width:118px;font-weight:700;white-space:nowrap;padding-right:14px}
.ez tr.g td.v{color:var(--acc)}
.ez tr.w td.v{color:var(--warn)}
.ez td.say{color:var(--mut)}
@media (max-width:520px){
  .ez td.k{width:60px} .ez td.v{width:90px;font-size:12.5px}
}
.co{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.px{text-align:right;font-weight:600}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{font-size:11px;font-weight:600;padding:2.5px 7px;border-radius:5px;background:var(--panel2);color:var(--mut);
  border:1px solid var(--line2)}
.chip b{font-weight:700;color:var(--ink)}
.chip.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.chip.trig{color:var(--up);border-color:color-mix(in srgb,var(--up) 40%,transparent)}
.body{padding:0 14px 14px;border-top:1px solid var(--line2)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin:13px 0}
.kv div{background:var(--panel2);border-radius:8px;padding:8px 10px}
.kv .k{font-size:11px;color:var(--mut);font-weight:600}
.kv .v{font-size:15px;font-weight:700;margin-top:1px}
.gen{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.gen .gg{stroke:var(--line2);stroke-width:1}
.gen .gt{font-size:15px;fill:var(--mut);font-family:ui-monospace,Consolas,monospace}
.gen .gh{font-size:15px;fill:var(--ink);font-weight:600}
.gen .lbg{fill:var(--panel);fill-opacity:.93;stroke:var(--line);stroke-width:1}
.gen .glb{font-size:15px;fill:var(--ink);font-weight:600}
.legend{font-size:11.5px;color:var(--dim);margin:8px 2px 0;display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:16px;height:2px;vertical-align:middle;margin-right:5px}
.read{font-size:13px;color:var(--mut);margin:10px 0 0;padding-left:11px;border-left:2px solid var(--line)}

/* ── 기록 */
details.day{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:9px;box-shadow:var(--shadow)}
details.day>summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.day>summary::-webkit-details-marker{display:none}
.date{font-weight:700;font-size:15px}
.mini{font-size:11.5px;color:var(--mut)}
.empty{color:var(--dim);font-size:13.5px;padding:18px 2px}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px}
footer b{color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){
  .wrap{padding:0 12px 60px} .hrow{padding:0 12px} nav{padding:8px 12px 0}
  .tile .v{font-size:22px} h1{font-size:17px}
}
</style>

/* ── 후보 카드 */
// 숫자마다 "쉬운 말" 한 줄을 붙인다. 값 → [표시값, 풀이, 톤(g좋음/w주의/"")]
function easy(m){
  const R=[];
  const add=(k,v,say,tone)=>{ if(v!=null&&say) R.push({k,v,say,tone:tone||""}); };
  add("위치(1년)", m.posGrade+" · 고가 "+n1(m.hi52d)+"%",
    {A:"신고가권 — 머리 위에 물린 사람이 없다",B:"고가 근처 — 남은 매물이 얇다",
     C:"위에 매물대가 남았다 — 덜 오른 게 아니라 덜 뚫은 것",D:"저점권 — 뚫을 게 너무 많이 남았다"}[m.posGrade],
    (m.posGrade==="A"||m.posGrade==="B")?"g":"w");
  if(m.wkPass!=null||m.pos5y!=null)
    add("주봉(5년)", (m.wkPass===true?"통과":(m.wkPass===false?"탈락":"신규"))+(m.pos5y!=null?" · "+n1(m.pos5y)+"%":""),
      m.wkPass===false?"큰 물살이 아직 아래를 본다 — 역행하는 자리"
      :(m.pos5y!=null&&m.pos5y<-30?"주간 추세는 위. 단 5년 고점까진 멀다 — 차트의 붉은 가로막대(옛 물량)를 눈으로 확인"
      :(m.wkPass===true?"주간 추세도 위(정배열+30주선 상승) — 큰 물살을 타는 중":"상장 1년 안팎 — 위에 물린 사람 자체가 없다")),
      m.wkPass===false?"w":(m.pos5y!=null&&m.pos5y<-30?"w":"g"));
  if(m.baseNo!=null)
    add("베이스", m.baseNo===0?"미형성":m.baseNo+"번째"+(m.baseLen?" · "+m.baseLen+"봉":""),
      m.baseNo===0?"저점 찍고 처음 오르는 중 — 추세의 최초입"
      :m.baseNo<=2?"추세 초입 — 제일 맛있는 구간(스윗스팟)"
      :m.baseNo===3?"추세 중반 — 아직 괜찮지만 신선도는 떨어짐"
      :"4번째 이상 — 추세가 늙었다. 늦게 탄 만큼 보수적으로",
      m.baseNo>=1&&m.baseNo<=2?"g":(m.baseNo>=4?"w":""));

function oneline(m){

  if(m.touch>=3) good.push("저항 "+m.touch+"번 두들김");
  if(m.tight<0.6) good.push("수축 팽팽");
  if(m.baseNo>=1&&m.baseNo<=2) good.push(m.baseNo+"번째 베이스");

  if(m.ur) good.push("어제 언더컷&랠리");
  if(m.stopTag.indexOf("1ADR")>=0) bad.push("스탑이 너무 좁다");
  if(m.stopTag.indexOf("3ADR")>=0) bad.push("스탑이 너무 멀다");
  if(m.dte!=null&&m.dte<=5) bad.push("실적 D-"+m.dte);
  else if(m.dte!=null&&m.dte<=10) bad.push("보유 중 실적(D-"+m.dte+")");
  if(m.extATR!=null&&m.extATR>=8) bad.push("과열");
  if(m.wkPass===false) bad.push("주봉 역행");
  if(m.posGrade==="C"||m.posGrade==="D") bad.push("위치 낮음");
  if(m.pos5y!=null&&m.pos5y<-30&&(m.posGrade==="A"||m.posGrade==="B")) bad.push("5년 시야엔 옛 물량");
  return `<span class="oneline">${good.slice(0,2).map(g=>`<b class="good">${esc(g)}</b>`).join(" · ")||"—"}${bad.length?` <span class="sep">·</span> <b class="bad">걸림: ${esc(bad.slice(0,2).join(", "))}</b>`:` <span class="sep">·</span> 걸리는 것 없음`}</span>`;
}

    <p class="lede">스크리너가 고른 것을 교재 규칙 그대로 <b>기계가</b> 사고팝니다. 사람 판단은 한 번도 안 들어갑니다 — 이 계좌의 성적이 곧 "규칙만 따라도 되는가"에 대한 답입니다.</p>`;
  const rules=`<p class="read"><b>규칙 전문</b> — 주력 등급만 · ⚠스탑 제외 · 실적 D-7 이내 제외 · 하루 신규는 국면이 정한 수 · 동시 4종목(리플레이 스윕: 슬롯 3→6에서 R합 단조 증가·MDD 4%대 유지, PF 최고인 4 채택) · 같은 섹터 2종목 · 역치에 buy-stop을 걸고 <b>그날 RVOL 1.3배 이상 실려야 체결</b>(가돌파 필터 — 1,072건 실측에서 1.3~1.5 구간도 전체 평균보다 좋아 1.5 대신 1.3) · 10일 내 미체결이면 취소 · <b>+1R에 스탑을 본전으로</b> · <b>타임컷: 5일 안에 +0.5R 못 가면 종가 청산</b>(중8 회전율 — 계좌 리플레이 +6.2%→+9.1%, 이안식 "애매하면 빼서 좋은 놈으로") · 20EMA 종가 이탈 청산 · 실적 전날 정리 · 갭은 시가 체결(갭은 스탑을 존중하지 않는다).</p>
    <p class="read"><b>장중 신규 진입</b> — 전 종목 스캔에서 <b>주력이 RVOL 1.3+ 싣고 터지면 어젯밤 대기열에 없어도 그 자리에서 산다</b>. 단 역치 위 0.5×ADR까지만 추격(그 위는 늦은 자리). 자리가 꽉 찼는데 안 터지는 약한 대기 주문이 있으면 취소하고 더 강한 신호로 교체한다 — 이것도 기계 규칙이다.</p>
    <p class="read"><b>강세에 매도</b> (1,101건 백테스트: 평균 +0.17→+0.21R · PF 1.47→1.57) — ① <b>과열 12배수</b>: 50일선 이격이 ATR 12배 이상이면 종가 전량(중6-3) ② <b>클라이막스 탑</b>: +1R 수익 중 RVOL 3배+ & 갭 3%+ & 하단 마감이면 전량(고2-4, HPE 6/2 유형) ③ <b>소진갭</b>: +1R 수익 중 갭 4%+ 뜨고 음봉 마감이면 전량. 마지막 불꽃에서 나가는 규칙들입니다.</p>
    <p class="read" style="border-left-color:var(--warn)">슬리피지·수수료는 없다고 가정합니다. 실제보다 약간 좋게 나옵니다.</p>`;
  if(!P||!P.equity||!P.equity.length){
    T.innerHTML=head+`<p class="empty"><b>가동 준비 완료 — ${P&&P.startedAt?kdate(P.startedAt):""} 종가부터 시작.</b><br>첫 종목 선정은 다음 종가 갱신(새벽 5:27) 때입니다. 그날 후보에서 규칙대로 고르고, 그다음 장부터 역치에 주문을 걸어둡니다. 매일 아침 여기서 계좌가 굴러가는 걸 보게 됩니다.</p>`+rules;
    return;
  }
  const S=P.summary||{};
  // 장중 체결이 있었으면 평가액은 실시간 값으로 보여준다 (성적 지표는 종가 확정분 유지)
  const liveOn = P.liveEq!=null && P.liveDate && P.liveDate>P.lastDate;
  const eqNow = liveOn ? P.liveEq : S.eq;
  const retNow = +(((eqNow/S.start)-1)*100).toFixed(2);
  const liveAgo = liveOn ? Math.round((Date.now()-new Date(P.liveAt).getTime())/60000) : null;
  const tile=(k,v,sub,tone)=>`<div class="tile"><div class="k">${k}</div><div class="v num${String(v).length>9?" sm":""}"${tone?` style="color:var(--${tone})"`:""}>${v}</div><div class="sub">${sub||""}</div></div>`;
  let curve="";
  if(P.equity.length>=2){
    const W=1200,H=240,ML=8,MR=88,MT=14,MB=10;
    const eqs=P.equity.map(e=>e.eq);
    let lo=Math.min(...eqs,S.start), hi=Math.max(...eqs,S.start);
    const pad=(hi-lo)*0.12||S.start*0.01; lo-=pad; hi+=pad;
    const X=i=>ML+i/(P.equity.length-1)*(W-ML-MR), Y=v=>MT+(hi-v)/(hi-lo)*(H-MT-MB);
    const pts=P.equity.map((e,i)=>X(i).toFixed(1)+","+Y(e.eq).toFixed(1)).join(" ");
    curve=`<svg viewBox="0 0 ${W} ${H}" class="gen" role="img" aria-label="계좌 곡선" style="margin:12px 0 4px">
      <line x1="${ML}" y1="${Y(S.start).toFixed(1)}" x2="${W-MR}" y2="${Y(S.start).toFixed(1)}" class="gg" stroke-dasharray="6 5"/>
      <text x="${W-MR+7}" y="${(Y(S.start)+4).toFixed(1)}" class="gt">1,000만</text>
      <polyline points="${pts}" fill="none" stroke="${S.eq>=S.start?"var(--up)":"var(--dn)"}" stroke-width="2.4"/>
      <text x="${W-MR+7}" y="${(Y(P.equity[P.equity.length-1].eq)+4).toFixed(1)}" class="gt" font-weight="700">${Math.round(S.eq/10000).toLocaleString()}만</text>
    </svg>`;
  }
  // [lps-dev] door==="L"이면 bucket·score점 자리에 눌림·시가 표시, 피라미딩(p.pyr)된 보유분은 +P 추가.
  const doorTagOpen=p=>(p.door==="L"?"눌림·시가":(esc(p.bucket||"")+"·"+(p.score||"")+"점"))+(p.pyr?" +P":"");
  const doorTagPend=o=>(o.door==="L"?"눌림·시가":(esc(o.bucket||"")+"·"+(o.score||"")+"점"));
  const openRows=(P.open||[]).map(p=>`<tr><td>${esc(p.s)} <span class="mini">${doorTagOpen(p)}</span></td>
    <td class="num">${kdate(p.fillDate)}</td><td class="num">${n2(p.fill)}</td>
    <td class="num">${n2(p.stop)}${p.be?' <span class="mini" style="color:var(--acc)">본전</span>':""}</td>
    <td class="num">${p.last!=null?n2(p.last):"—"}</td>
    <td class="num ${sgn(p.curR)}">${p.curR>0?"+":""}${n2(p.curR)}R</td></tr>`).join("");
  const pendRows=(P.pending||[]).map(o=>`<tr><td>${esc(o.s)} <span class="mini">${doorTagPend(o)}</span></td>
    <td class="num">${kdate(o.planned)}</td><td class="num">${n2(o.entry)}</td><td class="num">${n2(o.stop)}</td>
    <td class="num">${o.shares}주</td><td class="num">${Math.max(0,10-(o.age||0))}일</td></tr>`).join("");
  const logRows=[...(P.closed||[])].slice(-15).reverse().map(c=>`<tr>
    <td class="num">${kdate(c.date)}</td><td>${esc(c.s)}</td>
    <td style="text-align:left">${esc(c.why||c.kind)}</td>
    <td class="num ${c.R!=null?sgn(c.R):"zero"}">${c.R!=null?((c.R>0?"+":"")+n2(c.R)+"R"):"—"}</td>
    <td class="num ${sgn(c.won)}">${c.won?Math.round(c.won/10000)+"만":"—"}</td></tr>`).join("");
  T.innerHTML=head
    +`<div class="tiles">
      ${tile("평가액",Math.round(eqNow/10000).toLocaleString()+"만원",
        (retNow>0?"+":"")+retNow+"%"+(liveOn?" · 장중 "+(liveAgo<1?"방금":liveAgo+"분 전"):""),
        eqNow>=S.start?"up":"dn")}
      ${tile("청산",S.trades+"건","승률 "+(S.win==null?"—":S.win+"%"))}
      ${tile("R 합계",(S.sumR>0?"+":"")+S.sumR+"R","1R = 10만원 기준")}
      ${tile("PF",S.pf==null?"—":S.pf,"번 돈 ÷ 잃은 돈")}
      ${tile("MDD",S.mddPct+"%","최대 낙폭")}
      ${tile("지금",(P.open||[]).length+"보유 · "+(P.pending||[]).length+"대기","동시 최대 3종목")}
    </div>`
    +curve
    +(openRows?`<h2>보유 중 <span class="tag">${P.open.length}종목</span></h2>
      <div class="tbl"><table><thead><tr><th>종목</th><th>진입일</th><th>체결가</th><th>스탑</th><th>현재가</th><th>현재</th></tr></thead><tbody>${openRows}</tbody></table></div>`:"")
    +(pendRows?`<h2>대기 주문 <span class="tag">${P.pending.length}건</span></h2>
      <p class="lede">역치에 걸어둔 buy-stop. 가격이 닿고 <b>거래량이 실려야</b> 체결되고(RVOL 1.3배), 스탑이 먼저 깨지면 취소됩니다. 장중 5분마다 확인합니다 — 가격만 닿고 거래량이 안 실리면 계속 대기합니다.</p>
      <div class="tbl"><table><thead><tr><th>종목</th><th>주문일</th><th>진입가</th><th>스탑</th><th>수량</th><th>만료까지</th></tr></thead><tbody>${pendRows}</tbody></table></div>`:"")
    +(logRows?`<h2>매매 일지 <span class="tag">최근 ${Math.min(15,(P.closed||[]).length)}건</span></h2>
      <div class="tbl"><table><thead><tr><th>날짜</th><th>종목</th><th style="text-align:left">사유</th><th>결과</th><th>손익</th></tr></thead><tbody>${logRows}</tbody></table></div>`:"")
    +rules;
})();

/* ── 기록 */
const STCLR={"20EMA이탈":"pos","본전스탑":"zero","스탑":"neg","갭스탑":"neg","보유중":"pos","무효":"neg","불발":"zero","대기":"zero"};
(function(){
  const hs=DATA.hist;
  const real=hs.filter(h=>!h.backfill).length;
  $("#tab-hist").innerHTML=`<h2>날짜별 기록 <span class="tag">${hs.length}일</span></h2>
    <p class="lede">각 날짜를 펼치면 그날 뽑힌 후보가 <b>그 뒤 실제로 어떻게 됐는지</b> 나옵니다. 진입가에 사서 규칙대로 관리했다고 가정한 결과입니다.</p>
    <p class="read">실사용 기록 <b>${real}일</b> + 과거 재현(백필) <b>${hs.length-real}일</b>. 백필은 그 날짜까지의 봉만으로 스크리너를 다시 돌린 것이라 미래 정보가 섞이지 않았지만, <b>유니버스가 지금 살아있는 종목뿐</b>이라 상장폐지된 종목이 빠져 있습니다(생존편향). 실제보다 좋게 나옵니다.</p>`
    + hs.map((h,i)=>{
    const g=h.g||[];
    const fired=g.filter(r=>r.fired).length;
    const closed=g.filter(r=>r.resultR!=null&&r.status!=="보유중");
    const sumR=closed.reduce((a,r)=>a+r.resultR,0);
    const rows=g.map(r=>`<tr>
        <td>${esc(r.s)} <span class="mini">${esc(r.bucket)}·${esc(r.posGrade||"")}</span></td>
        <td class="num">${n2(r.entry)}</td><td class="num">${n2(r.stop)}</td>
        <td>${r.fired?r.days+"일 뒤 진입":"—"}</td>
        <td class="num">${r.fired?"+"+n2(r.mfe)+"R":"—"}</td>
        <td class="${STCLR[r.status]||""}">${esc(r.status)}</td>
        <td class="num ${sgn(r.resultR)}">${r.resultR==null?"—":(r.resultR>0?"+":"")+n2(r.resultR)+"R"}</td></tr>`).join("");
    return `<details class="day"${i===0?" open":""}><summary>
        <span class="date num">${kdate(h.date)}</span>
        ${h.backfill?'<span class="chip">백필</span>':'<span class="chip acc">실사용</span>'}
        <span class="mini">${esc(h.regime.split(" — ")[0])} · 50SMA 위 ${n1(h.br.mm50)}% · 후보 ${h.n||g.length}종목${
          g.length?` · 진입 ${fired} · 청산 ${closed.length}건 합계 ${sumR>0?"+":""}${n1(sumR)}R`:""}</span>
      </summary>
      <div class="body">${g.length?`<div class="tbl" style="box-shadow:none;margin-top:12px"><table>
        <thead><tr><th>종목</th><th>진입가</th><th>스탑</th><th style="text-align:right">진입</th><th>최대이익</th><th style="text-align:right">청산사유</th><th>결과</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`:'<p class="mini" style="padding:12px 0">아직 채점할 이후 데이터가 없습니다.</p>'}</div></details>`;
  }).join("");
})();

/* ── 성적표 */
(function(){
  const R=DATA.report;
  if(!R||!R.overall){
    $("#tab-score").innerHTML=`<h2>스크리너 성적표</h2>
      <p class="lede">과거 후보들이 실제로 어떻게 됐는지를 모아 스크리너 자체를 채점합니다.</p>
      <p class="empty">채점할 과거 기록이 아직 없습니다.</p>`;
    return;
  }
  const row=r=>`<tr><td>${esc(r.label)}</td>
    <td class="num">${r.n}</td><td class="num">${r.fired}</td><td class="num">${r.dead}</td>
    <td class="num">${r.closed}</td>
    <td class="num">${r.win==null?"—":r.win+"%"}</td>
    <td class="num ${sgn(r.avgR)}">${r.avgR==null?"—":(r.avgR>0?"+":"")+n2(r.avgR)+"R"}</td>
    <td class="num ${r.pf>=2?"pos":(r.pf<1?"neg":"")}">${r.pf==null?"—":n2(r.pf)}</td>
    <td class="num">${r.hold==null?"—":r.hold+"일"}</td>
    <td class="num">${r.mfe==null?"—":"+"+n2(r.mfe)+"R"}</td></tr>`;
  const tbl=(t,list)=>`<h2>${t}</h2><div class="tbl"><table>
    <thead><tr><th>구분</th><th>후보</th><th>진입</th><th>무효</th><th>청산</th><th>승률</th><th>평균R</th><th>PF</th><th>보유</th><th>최대이익</th></tr></thead>
    <tbody>${list.filter(Boolean).map(row).join("")}</tbody></table></div>`;
  $("#tab-score").innerHTML=`<h2>스크리너 성적표 <span class="tag">${R.snapshots}일 · ${R.overall.n}건</span></h2>
    <p class="lede">뽑아놓고 끝내면 스크리너가 좋은지 알 수 없습니다. 과거 후보를 전부 추적해 채점한 결과입니다.</p>
    <p class="read"><b>가정한 매매 규칙</b> — 진입가에 매수 → 초기 스탑 → <b>+1R 도달 시 스탑을 본전으로</b> → <b>20EMA 종가 이탈 시 청산</b>. 진입 전에 스탑이 먼저 깨지면 <b>무효</b>, ${R.expire}거래일 안에 진입가에 못 닿으면 <b>불발</b>로 종결합니다. 갭으로 스탑을 넘겨 열리면 시가에 체결된 것으로 계산합니다.</p>`
    + tbl("전체 · 바구니별",[R.overall,...(R.byBucket||[]).map(r=>({...r,label:r.label+" — "+(BUCKETS[r.label]?BUCKETS[r.label].t:r.label)}))])
    + tbl("위치 등급별 — 교재의 핵심 주장을 검증하는 표",(R.byPos||[]))
    + ((R.byWk&&R.byWk.length)?tbl("주봉 관문 — A·S·B에 이 관문을 켠 근거 (베이스0 제외)",R.byWk):"")
    + ((R.byHtf&&R.byHtf.length)?tbl("5년 고가 대비 위치 (주봉 기준)",R.byHtf):"")
    + ((R.byBase&&R.byBase.length)?tbl("베이스 번호별 (고1) — “1~2번째가 스윗스팟” 검증",R.byBase):"")
    + ((R.byExt&&R.byExt.length)?tbl("과열 구간별 (중6-3) — 50일선 대비 ATR 배수",R.byExt):"")
    + ((R.byFloat&&R.byFloat.length)?tbl("Float 구간별 (중6-4)",R.byFloat):"")
    + ((R.byUD&&R.byUD.length)?tbl("U/D 거래량 비율별 (중6-2)",R.byUD):"")
    + `<p class="read">교재 8교시 기준은 <b>PF 2 이상, 평균 R 0.3 이상</b>입니다.</p>
       <p class="read" style="border-left-color:var(--warn)"><b>이 숫자를 그대로 믿으면 안 되는 이유 세 가지</b><br>
       ① <b>생존편향</b> — 유니버스가 지금 상장·유동성이 있는 종목뿐이라, 그 사이 사라진 종목이 빠져 있습니다.<br>
       ② <b>체결 가정</b> — 진입가·스탑에 정확히 체결된다고 봤습니다. 실제로는 슬리피지와 수수료가 붙습니다.<br>
       ③ <b>동시 보유 제한 없음</b> — 하루에 뽑힌 후보를 전부 샀다고 가정했습니다. 실제로는 3종목까지입니다.<br>
       그래서 이 표는 <b>기대수익률이 아니라 조건 간 우열을 비교하는 용도</b>입니다.</p>`;
})();
</script>
